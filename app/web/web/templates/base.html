<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>{% block title %}gitops-watcher{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>

<div class="wrap">
  {% block content %}{% endblock %}
</div>

{% block overlays %}{% endblock %}

<div class="toasts" id="toasts" aria-live="polite">
  {% for kind, msg in get_flashed_messages(with_categories=true) %}
    <div class="toast {{ 'error' if kind == 'error' else '' }}">{{ msg }}</div>
  {% endfor %}
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
