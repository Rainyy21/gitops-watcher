services:
  gitops-watcher:
    build: .
    container_name: gitops-watcher
    restart: unless-stopped
    stop_grace_period: 5m  # let a running deploy finish on `docker stop`
    env_file: .env
    environment:
      CHECK_INTERVAL: 30
      STACKS_DIR: /opt/gitops
      CONFIG_PATH: /config/repos.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./repos.yml:/config/repos.yml  # writable, for `cli.py add/remove`
      - /opt/gitops:/opt/gitops
